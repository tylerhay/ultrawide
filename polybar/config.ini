#default colors
[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

#gruvbox
#[colors]
#background = #282828
#background-alt = #3c3836
#foreground = #ebdbb2
#primary = #fe8019
#secondary = #8ec07c
#alert = #fb4934
#disabled = #928374

#nord
#[colors]
#background     = #2E3440
#background-alt = #3B4252
#foreground     = #E5E9F0
#primary        = #88C0D0
#secondary      = #81A1C1
#alert          = #BF616A
#disabled       = #4C566A

#dracula
#[colors]
#background = #282a36
#background-alt = #44475a
#foreground = #f8f8f2
#primary = #bd93f9
#secondary = #ffb86c
#alert = #ff5555
#disabled = #6272a4

[bar/main]
width = 100%
height = 22pt
radius = 0 
offset-x = 720
monitor = DP-0
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = Hack Nerd Font:pixelsize=11;0
font-1 = Symbols Nerd Font:pixelsize=11;0

modules-left = logo xworkspaces xwindow
#modules-center = now-playing
modules-right = xbox_controller pulseaudio memory cpu date calcurse tray powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html

[bar/secondary]
width = 100%
height = 20pt
radius = 0 
monitor = DP-2
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = Hack Nerd Font:pixelsize=11;2
font-1 = Symbols Nerd Font:pixelsize=11;6

modules-left = xworkspaces xwindow
modules-right = pulseaudio date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = 
label-muted-foreground = ${colors.disabled}
click-right = exec pavucontrol &

[module/brightness]
type = internal/backlight
; Set this to the correct device from /sys/class/backlight
card = nvidia_0
use-actual-brightness = true

format = <ramp> <label>
label = %percentage%%

; Nerd Font icons (low → high)
ramp-0 = "󰃞"
ramp-1 = "󰃟"
ramp-2 = "󰃠"

; Optional: scroll to change brightness (requires brightnessctl)
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-


[module/brightness-ddc]
type = custom/ipc
initial = 1

; Fast status print (reads cache, one quick hw read on first run)
hook-0 = bash -lc 'DDC_DISPLAY=1 ~/.config/polybar/scripts/ddc-brightness.sh print'

; Scroll adjusts asynchronously and triggers a redraw itself
hook-1 = bash -lc 'BAR_PID=%pid% DDC_DISPLAY=1 STEP=5 SLEEP_MULT=0.4 ~/.config/polybar/scripts/ddc-brightness.sh up'
hook-2 = bash -lc 'BAR_PID=%pid% DDC_DISPLAY=1 STEP=5 SLEEP_MULT=0.4 ~/.config/polybar/scripts/ddc-brightness.sh down'

format = <output>
label = %output%

scroll-up   = polybar-msg -p %pid% hook brightness-ddc 1
scroll-down = polybar-msg -p %pid% hook brightness-ddc 2

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
#label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%
label-connected =   %essid%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S
date-alt = %a %b, %d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

#[module/battery]
#type = internal/battery
#full-at = 80
#low-at = 5
#battery = BAT1
#adapter = AC
#poll-interval = 5

[module/battery-combined-udev]
type = custom/script
exec = bash ~/.config/polybar/scripts/battery-combined-udev.sh
tail = true

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/bat-status-bar.sh
click-left = ~/.config/polybar/scripts/bat-dropdown-rofi.sh
interval = 10

[module/tray]
type           = internal/tray
tray-position  = right 
tray-padding   = 2 
tray-offset-x  = 0
tray-offset-y  = 0

[module/powermenu]
type = custom/text
content = ⏻
click-left = ~/.config/rofi/scripts/powermenu_t1
; optionally change formatting:
; label-font = 2
; label-padding = 1
; label-background = #ff5555

[module/calcurse]
type = custom/script
exec = date "+%a %b %d"
interval = once
label = 󰃭 %output%
click-left = ~/.config/polybar/scripts/calcurse.sh

[module/playerctl]
type = custom/script
exec = ~/.config/polybar/scripts/playerctl.sh
interval = 0.5

[module/now-playing]
type = custom/script
tail = true
;format-prefix = ""
format = <label>
exec = ~/.config/polybar/scripts/polybar-now-playing
click-right = "kill -USR1 $(pgrep --oldest --parent %pid%)"

[module/logo]
type = custom/text
click-left = rofi -show drun
click-right = rofi -show window
label =  
label-padding = 1

[module/picom]
type = custom/script
exec = [ -f ~/.cache/picom_on ] && echo " COMPOSITE" || echo " NO COMP."
interval = 1

[module/xbox_controller]
type = custom/script
exec = ~/.config/polybar/scripts/xbox_controller.sh
interval = 3
click-left = ~/.config/polybar/xbox_controller.sh toggle
label = %output%

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
